org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.workers.max=4
android.useAndroidX=true
android.nonTransitiveRClass=true

# Collect the original private JSON report after connectedDebugAndroidTest.
# AGP otherwise uninstalls the app (and deletes that report) before adb run-as.
# The workflow disposes of its dedicated emulator after evidence collection.
android.injected.androidTest.leaveApksInstalledAfterRun=true
